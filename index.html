<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>

  <!-- Tailwind CSS (CDN, no build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Custom green palette
            neutral: '#EEEEEE',     // light bg / surfaces / text on dark green
            'green-light': '#6FCF97', // operator buttons, accents
            'green-mid': '#2FA084',   // equals button, active states
            'green-dark': '#1F6F5F',  // dark bg/card, pressed states, history header
          },
        },
      },
    };
  </script>

  <!-- Apply saved theme before paint (avoid flash of wrong theme) -->
  <script>
    (function () {
      var saved = localStorage.getItem('calc-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- React + ReactDOM (production UMD builds) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone: transpile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Smooth color transitions when toggling theme */
    body, .calc-card { transition: background-color .25s ease, color .25s ease; }
  </style>
</head>
<body class="bg-neutral dark:bg-green-dark min-h-screen text-gray-900 dark:text-neutral">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    // ---- Pure math helpers (no eval) ----
    function compute(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '×': return a * b;
        case '÷': return b === 0 ? null : a / b; // null => divide-by-zero error
        default: return b;
      }
    }

    // Format a number to avoid floating-point noise; fall back to exponential
    // for very large/small magnitudes.
    function formatResult(n) {
      if (n === null || n === undefined || Number.isNaN(n)) return 'Error';
      if (!Number.isFinite(n)) return 'Error';
      const abs = Math.abs(n);
      if (abs !== 0 && (abs >= 1e15 || abs < 1e-9)) {
        return n.toExponential(6).replace(/\.?0+e/, 'e');
      }
      // Round to ~12 significant figures, then trim trailing zeros.
      let s = Number(n.toPrecision(12)).toString();
      return s;
    }

    function Button({ children, onClick, className = '', span = 1, ariaLabel }) {
      return (
        <button
          onClick={onClick}
          aria-label={ariaLabel || (typeof children === 'string' ? children : undefined)}
          className={
            'h-14 sm:h-16 rounded-xl font-semibold text-lg select-none ' +
            'transition transform active:scale-95 focus:outline-none focus:ring-2 ' +
            'focus:ring-green-mid/60 ' +
            (span === 2 ? 'col-span-2 ' : '') +
            className
          }
        >
          {children}
        </button>
      );
    }

    function App() {
      const [display, setDisplay] = useState('0');
      const [previous, setPrevious] = useState(null); // stored operand (number)
      const [operator, setOperator] = useState(null);
      const [overwrite, setOverwrite] = useState(true); // next digit replaces display
      const [history, setHistory] = useState([]);
      const [isDark, setIsDark] = useState(
        document.documentElement.classList.contains('dark')
      );

      // ----- Theme -----
      const toggleTheme = useCallback(() => {
        setIsDark((d) => {
          const next = !d;
          document.documentElement.classList.toggle('dark', next);
          localStorage.setItem('calc-theme', next ? 'dark' : 'light');
          return next;
        });
      }, []);

      // ----- Input handlers -----
      const inputDigit = useCallback((d) => {
        setDisplay((cur) => {
          if (overwrite) return d;
          if (cur === '0') return d;
          if (cur.replace('-', '').length >= 15) return cur; // cap length
          return cur + d;
        });
        setOverwrite(false);
      }, [overwrite]);

      const inputDecimal = useCallback(() => {
        setDisplay((cur) => {
          if (overwrite) return '0.';
          if (cur.includes('.')) return cur;
          return cur + '.';
        });
        setOverwrite(false);
      }, [overwrite]);

      const clearAll = useCallback(() => {
        setDisplay('0');
        setPrevious(null);
        setOperator(null);
        setOverwrite(true);
      }, []);

      const clearEntry = useCallback(() => {
        setDisplay('0');
        setOverwrite(true);
      }, []);

      const backspace = useCallback(() => {
        if (overwrite) return;
        setDisplay((cur) => {
          if (cur.length <= 1 || (cur.length === 2 && cur.startsWith('-'))) return '0';
          return cur.slice(0, -1);
        });
      }, [overwrite]);

      const toggleSign = useCallback(() => {
        setDisplay((cur) => {
          if (cur === '0' || cur === 'Error') return cur;
          return cur.startsWith('-') ? cur.slice(1) : '-' + cur;
        });
      }, []);

      const percent = useCallback(() => {
        setDisplay((cur) => {
          const val = parseFloat(cur);
          if (Number.isNaN(val)) return cur;
          // If there's a pending op, percent is relative to previous operand.
          if (operator && previous !== null) {
            return formatResult((previous * val) / 100);
          }
          return formatResult(val / 100);
        });
        setOverwrite(true);
      }, [operator, previous]);

      const chooseOperator = useCallback((op) => {
        const current = parseFloat(display);
        if (display === 'Error') return;

        if (operator && !overwrite && previous !== null) {
          // Chain: evaluate the pending op first.
          const result = compute(previous, current, operator);
          if (result === null) {
            setDisplay('Error');
            setPrevious(null);
            setOperator(null);
            setOverwrite(true);
            return;
          }
          const formatted = formatResult(result);
          setHistory((h) => [
            { expression: `${formatResult(previous)} ${operator} ${formatResult(current)}`, result: formatted },
            ...h,
          ]);
          setDisplay(formatted);
          setPrevious(result);
        } else {
          setPrevious(current);
        }
        setOperator(op);
        setOverwrite(true);
      }, [display, operator, overwrite, previous]);

      const equals = useCallback(() => {
        if (operator === null || previous === null || display === 'Error') return;
        const current = parseFloat(display);
        const result = compute(previous, current, operator);
        if (result === null) {
          setDisplay('Error');
          setPrevious(null);
          setOperator(null);
          setOverwrite(true);
          return;
        }
        const formatted = formatResult(result);
        setHistory((h) => [
          { expression: `${formatResult(previous)} ${operator} ${formatResult(current)}`, result: formatted },
          ...h,
        ]);
        setDisplay(formatted);
        setPrevious(null);
        setOperator(null);
        setOverwrite(true);
      }, [operator, previous, display]);

      const clearHistory = useCallback(() => setHistory([]), []);

      const loadFromHistory = useCallback((value) => {
        setDisplay(value);
        setPrevious(null);
        setOperator(null);
        setOverwrite(true);
      }, []);

      // ----- Keyboard support -----
      useEffect(() => {
        const onKey = (e) => {
          const k = e.key;
          if (k >= '0' && k <= '9') { inputDigit(k); }
          else if (k === '.') { inputDecimal(); }
          else if (k === '+' ) { chooseOperator('+'); }
          else if (k === '-') { chooseOperator('-'); }
          else if (k === '*') { chooseOperator('×'); }
          else if (k === '/') { e.preventDefault(); chooseOperator('÷'); }
          else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
          else if (k === 'Backspace') { backspace(); }
          else if (k === 'Escape') { clearAll(); }
          else if (k === '%') { percent(); }
          else { return; }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [inputDigit, inputDecimal, chooseOperator, equals, backspace, clearAll, percent]);

      // Pending expression line (e.g. "12 ×")
      const pending = operator !== null && previous !== null
        ? `${formatResult(previous)} ${operator}`
        : ' ';

      // ----- Styles per button type -----
      const numBtn = 'bg-neutral dark:bg-green-dark/60 text-gray-900 dark:text-neutral hover:bg-gray-200 dark:hover:bg-green-dark';
      const opBtn = 'bg-green-light text-green-dark hover:bg-green-mid hover:text-white';
      const fnBtn = 'bg-gray-300 dark:bg-green-dark/40 text-gray-800 dark:text-neutral hover:bg-gray-400 dark:hover:bg-green-dark';
      const eqBtn = 'bg-green-mid text-white hover:bg-green-dark';
      const activeOp = 'ring-2 ring-green-mid';

      const opClass = (op) =>
        opBtn + ' ' + (operator === op && overwrite ? activeOp : '');

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-3xl flex flex-col md:flex-row gap-4 items-stretch justify-center">

            {/* Calculator card */}
            <div className="calc-card bg-white dark:bg-green-dark rounded-2xl shadow-xl p-4 sm:p-6 w-full md:max-w-sm">
              {/* Header */}
              <div className="flex items-center justify-between mb-3">
                <h1 className="text-lg font-bold text-green-dark dark:text-neutral">Calculator</h1>
                <button
                  onClick={toggleTheme}
                  aria-label="Toggle dark mode"
                  className="h-9 px-3 rounded-lg text-sm font-medium bg-green-light text-green-dark hover:bg-green-mid hover:text-white transition"
                >
                  {isDark ? '☀️ Light' : '🌙 Dark'}
                </button>
              </div>

              {/* Display */}
              <div className="bg-neutral dark:bg-green-dark/50 rounded-xl px-4 py-3 mb-4 text-right">
                <div className="h-5 text-sm text-gray-500 dark:text-neutral/60 truncate">{pending}</div>
                <div className="text-4xl font-light text-gray-900 dark:text-neutral truncate">{display}</div>
              </div>

              {/* Keypad */}
              <div className="grid grid-cols-4 gap-2">
                <Button onClick={clearAll} className={fnBtn} ariaLabel="Clear all">AC</Button>
                <Button onClick={clearEntry} className={fnBtn} ariaLabel="Clear entry">CE</Button>
                <Button onClick={percent} className={fnBtn}>%</Button>
                <Button onClick={() => chooseOperator('÷')} className={opClass('÷')}>÷</Button>

                <Button onClick={() => inputDigit('7')} className={numBtn}>7</Button>
                <Button onClick={() => inputDigit('8')} className={numBtn}>8</Button>
                <Button onClick={() => inputDigit('9')} className={numBtn}>9</Button>
                <Button onClick={() => chooseOperator('×')} className={opClass('×')}>×</Button>

                <Button onClick={() => inputDigit('4')} className={numBtn}>4</Button>
                <Button onClick={() => inputDigit('5')} className={numBtn}>5</Button>
                <Button onClick={() => inputDigit('6')} className={numBtn}>6</Button>
                <Button onClick={() => chooseOperator('-')} className={opClass('-')}>−</Button>

                <Button onClick={() => inputDigit('1')} className={numBtn}>1</Button>
                <Button onClick={() => inputDigit('2')} className={numBtn}>2</Button>
                <Button onClick={() => inputDigit('3')} className={numBtn}>3</Button>
                <Button onClick={() => chooseOperator('+')} className={opClass('+')}>+</Button>

                <Button onClick={toggleSign} className={numBtn} ariaLabel="Toggle sign">±</Button>
                <Button onClick={() => inputDigit('0')} className={numBtn}>0</Button>
                <Button onClick={inputDecimal} className={numBtn}>.</Button>
                <Button onClick={equals} className={eqBtn} ariaLabel="Equals">=</Button>
              </div>
            </div>

            {/* History panel */}
            <div className="calc-card bg-white dark:bg-green-dark rounded-2xl shadow-xl p-4 w-full md:w-64 flex flex-col">
              <div className="flex items-center justify-between bg-green-dark text-neutral rounded-lg px-3 py-2 mb-3">
                <span className="font-semibold text-sm">History</span>
                <button
                  onClick={clearHistory}
                  className="text-xs px-2 py-1 rounded bg-green-light text-green-dark hover:bg-green-mid hover:text-white transition"
                >
                  Clear
                </button>
              </div>
              <div className="flex-1 overflow-y-auto max-h-72 md:max-h-96 space-y-2 pr-1">
                {history.length === 0 ? (
                  <p className="text-sm text-gray-400 dark:text-neutral/50 text-center mt-6">
                    No calculations yet
                  </p>
                ) : (
                  history.map((item, i) => (
                    <button
                      key={i}
                      onClick={() => loadFromHistory(item.result)}
                      className="w-full text-right rounded-lg px-3 py-2 bg-neutral dark:bg-green-dark/50 hover:bg-green-light/40 dark:hover:bg-green-mid/40 transition"
                    >
                      <div className="text-xs text-gray-500 dark:text-neutral/60 truncate">{item.expression} =</div>
                      <div className="text-base font-semibold text-gray-900 dark:text-neutral truncate">{item.result}</div>
                    </button>
                  ))
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
